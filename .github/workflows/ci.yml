name: Build and deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: fb-eksamen2026-25
  DOCKERHUB_REPOSITORY: wishifai

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          rev=$(git rev-parse --short HEAD)
          ECR_IMAGE="$REGISTRY/$ECR_REPOSITORY"
          DOCKERHUB_IMAGE="$DOCKER_USERNAME/$DOCKERHUB_REPOSITORY"
          docker build -t "$ECR_IMAGE:$rev" -t "$ECR_IMAGE:latest" -t "$DOCKERHUB_IMAGE:$rev" -t "$DOCKERHUB_IMAGE:latest" .
          docker push --all-tags "$ECR_IMAGE"
          docker push --all-tags "$DOCKERHUB_IMAGE"